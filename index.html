<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer" />
  <title>AI智能菜谱平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: '#F8F3E6',
            sage: '#87A884',
            sageDark: '#6b8c68',
            textMain: '#443E38'
          },
          fontFamily: {
            sans: ['system-ui', 'PingFang SC', 'Microsoft YaHei']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F8F3E6; color: #443E38; }
    .sage-gradient { background: linear-gradient(135deg, #87A884, #6b8c68); }
    .card-shadow { box-shadow: 0 4px 12px rgba(135, 168, 132, 0.15); }
    .recipe-img { aspect-ratio: 16/10; object-fit: cover; }
    #detailModal { z-index: 9999 !important; }
    .loading-spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen">
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur card-shadow px-4 md:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-xl md:text-2xl font-bold text-sage flex items-center gap-2">
        <i class="fa fa-cutlery"></i> AI智能菜谱库
      </h1>
      <div class="flex gap-4 md:gap-6 text-sm md:text-base">
        <button onclick="switchTab('home')" class="nav-btn py-1 border-b-2 border-transparent hover:text-sage">菜谱首页</button>
        <button onclick="switchTab('collect')" class="nav-btn py-1 border-b-2 border-transparent hover:text-sage">我的收藏</button>
        <button onclick="switchTab('cart')" class="nav-btn py-1 border-b-2 border-transparent hover:text-sage relative">
          点菜车
          <span id="cartBadge" class="absolute -top-1 -right-3 bg-red-400 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
        <button onclick="switchTab('buyList')" class="nav-btn py-1 border-b-2 border-transparent hover:text-sage">采购清单</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 md:p-6 py-8">
    <section id="homeTab" class="tab-content">
      <div class="bg-white rounded-xl p-4 md:p-6 card-shadow mb-8">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-4">
          <div class="w-full md:w-1/2 relative flex gap-2 flex-wrap">
            <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="本地菜谱检索 / AI生成任意菜品做法" class="flex-1 pl-9 pr-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-sage">
            <button onclick="localSearch()" class="sage-gradient text-white px-3 rounded">本地检索</button>
            <button onclick="aiGenerateRecipe()" class="bg-orange-500 text-white px-3 rounded flex items-center gap-1">
              <i class="fa fa-robot"></i> AI生成菜谱
            </button>
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="setCategory('all')" class="cate-btn px-4 py-1 rounded-full sage-gradient text-white text-sm">全部</button>
            <button onclick="setCategory('肉类')" class="cate-btn px-4 py-1 rounded-full bg-gray-100 text-sm hover:bg-sage/20">肉类</button>
            <button onclick="setCategory('素菜')" class="cate-btn px-4 py-1 rounded-full bg-gray-100 text-sm hover:bg-sage/20">素菜</button>
            <button onclick="setCategory('汤品')" class="cate-btn px-4 py-1 rounded-full bg-gray-100 text-sm hover:bg-sage/20">汤品</button>
          </div>
        </div>
        <div id="aiLoadingTip" class="text-orange-500 hidden my-2">
          <i class="fa fa-circle-o-notch loading-spin inline-block"></i> AI正在生成菜谱，请稍等片刻...
        </div>
      </div>
      <div id="recipeList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>

    <section id="collectTab" class="tab-content hidden">
      <h2 class="text-xl font-semibold mb-6 border-l-4 border-sage pl-3">❤️ 收藏菜谱</h2>
      <div id="collectList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-20 text-gray-400">暂无收藏的菜品</div>
      </div>
    </section>

    <section id="cartTab" class="tab-content hidden">
      <h2 class="text-xl font-semibold mb-6 border-l-4 border-sage pl-3">🛒 已点菜品</h2>
      <div id="cartList" class="space-y-4">
        <div class="text-center py-20 text-gray-400">购物车空空如也，快去挑选菜品吧</div>
      </div>
      <div class="mt-6 flex justify-end">
        <button onclick="switchTab('buyList')" class="sage-gradient text-white px-6 py-2 rounded-lg">生成采购清单</button>
      </div>
    </section>

    <section id="buyListTab" class="tab-content hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold border-l-4 border-sage pl-3">📋 食材采购清单</h2>
        <div class="flex gap-3">
          <button onclick="copyBuyList()" class="bg-sage text-white px-4 py-2 rounded-lg text-sm"><i class="fa fa-copy mr-1"></i>复制清单</button>
          <button onclick="clearCart()" class="bg-red-300 text-white px-4 py-2 rounded-lg text-sm">清空购物车</button>
        </div>
      </div>
      <div id="buyTotalProgress" class="mb-6 bg-white rounded-lg p-4 card-shadow">
        <p class="text-sm mb-2">采购完成进度：<span id="progressNum">0%</span></p>
        <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-sage w-0 transition-all"></div>
        </div>
      </div>
      <div id="buyListBox" class="grid md:grid-cols-3 gap-6">
        <div class="text-center py-20 text-gray-400 col-span-3">选购菜品后自动生成食材清单</div>
      </div>
      <textarea id="copyText" class="hidden"></textarea>
    </section>
  </main>

  <!-- 菜品弹窗 -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 z-[9999] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto card-shadow">
      <div class="relative">
        <img id="modalImg" src="" class="w-full h-64 recipe-img rounded-t-xl bg-gray-200">
        <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 bg-white/70 rounded-full flex items-center justify-center"><i class="fa fa-times"></i></button>
      </div>
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <div>
            <h3 id="modalName" class="text-2xl font-bold"></h3>
            <span id="modalCate" class="inline-block mt-1 px-2 py-0.5 bg-sage/10 text-sage rounded text-sm"></span>
          </div>
          <button id="collectBtn" onclick="toggleCollect()" class="text-xl text-gray-300 hover:text-red-400"><i class="fa fa-heart-o"></i></button>
        </div>
        <div class="grid md:grid-cols-2 gap-6 my-6">
          <div>
            <h4 class="font-semibold text-lg mb-3 flex items-center gap-2"><i class="fa fa-list-ul text-sage"></i>所需食材</h4>
            <ul id="modalFood" class="space-y-2 text-sm"></ul>
          </div>
          <div>
            <h4 class="font-semibold text-lg mb-3 flex items-center gap-2"><i class="fa fa-fire text-sage"></i>详细烹饪步骤</h4>
            <ol id="modalStep" class="space-y-3 text-sm list-decimal pl-4"></ol>
          </div>
        </div>
        <div class="flex gap-4">
          <button onclick="addCart()" class="sage-gradient text-white px-5 py-2 rounded-lg flex-1">加入点菜车</button>
          <button onclick="closeModal()" class="border border-sage text-sage px-5 py-2 rounded-lg flex-1">关闭</button>
        </div>
      </div>
    </div>
  </div>

    let aiGeneratedRecipe = null;
    let collectList = JSON.parse(localStorage.getItem("recipeCollect")) || []
    let cartList = JSON.parse(localStorage.getItem("recipeCart")) || []
    let nowOpenItem = null
    let selectCate = "all"
    let showData = [...localData]

    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"))
      document.getElementById(`${tabName}Tab`).classList.remove("hidden")
      if(tabName === "collect") renderCollect()
      if(tabName === "cart") renderCart()
      if(tabName === "buyList") renderBuyList()
    }

    function render(list) {
      const wrap = document.getElementById("recipeList")
      wrap.innerHTML = ""
      if(list.length === 0) {
        wrap.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">暂无菜谱数据</div>`
        return
      }
      list.forEach(item => {
        const isCol = collectList.some(c => c.id === item.id)
        const card = document.createElement("div")
        card.className = "bg-white rounded-xl overflow-hidden card-shadow hover:shadow-lg transition"
        card.innerHTML = `
          <img src="${item.img || 'https://picsum.photos/id/1080/800/450'}" onclick='openModal(${JSON.stringify(item).replace(/"/g,"&quot;")})' class="w-full recipe-img cursor-pointer">
          <div class="p-4">
            <div class="flex justify-between items-center">
              <h4 class="font-bold text-lg">${item.name}</h4>
              <i onclick="event.stopPropagation();quickCollect(${JSON.stringify(item).replace(/"/g,"&quot;")})" class="fa fa-heart ${isCol?'text-red-400':'text-gray-300'} text-lg cursor-pointer"></i>
            </div>
            <span class="text-xs bg-sage/10 text-sage px-2 py-0.5 rounded mt-1 inline-block">${item.cate}</span>
            <button onclick='openModal(${JSON.stringify(item).replace(/"/g,"&quot;")})' class="mt-3 w-full border border-sage text-sage rounded py-1.5 hover:bg-sage hover:text-white text-sm">查看做法</button>
          </div>
        `
        wrap.appendChild(card)
      })
      showData = list
    }

    function localSearch() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase()
      let tempArr = [...localData]
      if(selectCate !== "all") tempArr = tempArr.filter(v=>v.cate === selectCate)
      if(keyword){
        tempArr = tempArr.filter(item=>{
          const nameMatch = item.name.toLowerCase().includes(keyword)
          const foodMatch = item.food.some(f=>f.name.includes(keyword))
          return nameMatch || foodMatch
        })
      }
      render(tempArr)
    }

    function setCategory(cate) {
      selectCate = cate
      document.querySelectorAll(".cate-btn").forEach(btn=>{
        btn.classList.remove("sage-gradient","text-white")
        btn.classList.add("bg-gray-100")
      })
      event.target.classList.remove("bg-gray-100")
      event.target.classList.add("sage-gradient","text-white")
      localSearch()
    }

    // ========== 已经替换完成的AI生成函数，无需你修改 ==========
    async function aiGenerateRecipe(){
      const keyword = document.getElementById("searchInput").value.trim()
      const tipDom = document.getElementById("aiLoadingTip")
      if(!keyword){
        alert("请输入需要查询的菜品名称");return;
      }
      tipDom.classList.remove("hidden")
      const prompt = `你现在是专业厨师，根据菜品【${keyword}】，严格按照下面JSON格式返回内容，不要多余文字、不要解释。
格式：
{
  "name":"菜名",
  "cate":"分类（肉类/素菜/汤品三选一）",
  "food":[{"name":"食材名称","num":"用量","type":"肉类/蔬菜/调料"}],
  "step":["步骤1","步骤2","步骤3","步骤4"]
}`
      try {
        const res = await fetch("/api/proxy",{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            model:"deepseek-chat",
            messages:[{"role":"user","content":prompt}],
            temperature:0.7
          })
        })
        const resData = await res.json()
        const jsonStr = resData.choices[0].message.content.trim()
        const recipeObj = JSON.parse(jsonStr)
        recipeObj.id = "ai_" + Date.now()
        recipeObj.img = ""
        aiGeneratedRecipe = recipeObj
        render([recipeObj])
      } catch (err) {
        console.error(err)
        alert("AI生成失败，网络异常")
      } finally {
        tipDom.classList.add("hidden")
      }
    }

    function openModal(item) {
      nowOpenItem = item
      document.getElementById("modalName").innerText = item.name
      document.getElementById("modalCate").innerText = item.cate
      document.getElementById("modalImg").src = item.img || "https://picsum.photos/id/1080/800/450"
      document.getElementById("modalFood").innerHTML = item.food.map(f=>`<li>• ${f.name}：${f.num}</li>`).join("")
      document.getElementById("modalStep").innerHTML = item.step.map(s=>`<li>${s}</li>`).join("")
      const heartIcon = document.querySelector("#collectBtn i")
      const hasCol = collectList.some(c=>c.id === item.id)
      heartIcon.className = hasCol ? "fa fa-heart text-red-400 text-xl" : "fa fa-heart-o text-gray-300 text-xl"
      document.getElementById("detailModal").classList.remove("hidden")
    }
    function closeModal(){
      document.getElementById("detailModal").classList.add("hidden")
    }

    function toggleCollect(){
      const idx = collectList.findIndex(c=>c.id === nowOpenItem.id)
      idx > -1 ? collectList.splice(idx,1) : collectList.push({...nowOpenItem})
      localStorage.setItem("recipeCollect",JSON.stringify(collectList))
      openModal(nowOpenItem)
      render(showData)
    }
    function quickCollect(item){
      const idx = collectList.findIndex(c=>c.id === item.id)
      idx > -1 ? collectList.splice(idx,1) : collectList.push({...item})
      localStorage.setItem("recipeCollect",JSON.stringify(collectList))
      render(showData)
    }
    function addCart(){
      const exist = cartList.find(v=>v.id === nowOpenItem.id)
      exist ? exist.num++ : cartList.push({id:nowOpenItem.id,num:1,info:nowOpenItem})
      localStorage.setItem("recipeCart",JSON.stringify(cartList))
      updateCartBadge()
      alert("已加入点菜车")
    }
    function updateCartBadge(){
      const total = cartList.reduce((sum,item)=>sum.num,0)
      const badge = document.getElementById("cartBadge")
      total>0 ? (badge.innerText=total,badge.classList.remove("hidden")) : badge.classList.add("hidden")
    }
    function renderCart(){
      const wrap = document.getElementById("cartList")
      if(cartList.length === 0){ wrap.innerHTML = '<div class="text-center py-20 text-gray-400">购物车空空如也</div>';return }
      wrap.innerHTML = ""
      cartList.forEach(item=>{
        const info = item.info
        const dom = document.createElement("div")
        dom.className = "bg-white p-4 rounded-lg card-shadow flex items-center gap-4"
        dom.innerHTML = `
          <img src="${info.img||''}" class="w-20 h-14 rounded object-cover">
          <div class="flex-1">${info.name}</div>
          <div class="flex items-center gap-2">
            <button onclick="changeCartNum('${item.id}',-1)" class="w-7 h-7 bg-gray-100 rounded">-</button>
            <span>${item.num}</span>
            <button onclick="changeCartNum('${item.id}',1)" class="w-7 h-7 bg-gray-100 rounded">+</button>
            <button onclick="delCartItem('${item.id}')" class="text-red-400"><i class="fa fa-trash"></i></button>
          </div>
        `
        wrap.appendChild(dom)
      })
    }
    function changeCartNum(id,step){
      const item = cartList.find(v=>v.id == id)
      item.num += step
      if(item.num <=0) delCartItem(id)
      else { localStorage.setItem("recipeCart",JSON.stringify(cartList));renderCart();updateCartBadge() }
    }
    function delCartItem(id){
      cartList = cartList.filter(v=>v.id != id)
      localStorage.setItem("recipeCart",JSON.stringify(cartList))
      renderCart();updateCartBadge()
    }
    function clearCart(){
      cartList = []
      localStorage.setItem("recipeCart",JSON.stringify(cartList))
      renderCart();renderBuyList();updateCartBadge()
    }
    function renderCollect(){
      const wrap = document.getElementById("collectList")
      if(collectList.length === 0){ wrap.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400">暂无收藏</div>';return }
      wrap.innerHTML = ""
      collectList.forEach(item=>{
        const dom = document.createElement("div")
        dom.className = "bg-white rounded-xl overflow-hidden card-shadow"
        dom.innerHTML = `
          <img src="${item.img||''}" onclick='openModal(${JSON.stringify(item).replace(/"/g,"&quot;")})' class="w-full recipe-img cursor-pointer">
          <div class="p-4">
            <h4 class="font-bold text-lg">${item.name}</h4>
            <span class="text-xs bg-sage/10 text-sage px-2 py-0.5 rounded mt-1 inline-block">${item.cate}</span>
            <div class="flex gap-2 mt-3">
              <button onclick='openModal(${JSON.stringify(item).replace(/"/g,"&quot;")})' class="flex-1 py-1.5 border border-sage rounded text-sm">查看</button>
              <button onclick='quickCollect(${JSON.stringify(item).replace(/"/g,"&quot;")})' class="flex-1 py-1.5 bg-red-100 text-red-400 rounded text-sm">取消收藏</button>
            </div>
          </div>
        `
        wrap.appendChild(dom)
      })
    }
    function renderBuyList(){
      const wrap = document.getElementById("buyListBox")
      if(cartList.length === 0){ wrap.innerHTML = '<div class="col-span-3 text-center py-20 text-gray-400">选购菜品生成清单</div>';updateProgress(0);return }
      const foodMap = {}
      cartList.forEach(cartItem=>{
        cartItem.info.food.forEach(fd=>{
          const key = fd.name + fd.type
          if(!foodMap[key]) foodMap[key] = {...fd,count:0,checked:false}
          foodMap[key].count += cartItem.num
        })
      })
      const group = {肉类:[],蔬菜:[],调料:[]}
      Object.values(foodMap).forEach(f=>group[f.type]?.push(f))
      wrap.innerHTML = ""
      Object.keys(group).forEach(type=>{
        const box = document.createElement("div")
        box.className = "bg-white rounded-lg p-5 card-shadow"
        let html = `<h4 class="font-semibold text-lg mb-4 text-sage">${type}食材</h4><div class="space-y-2">`
        group[type].forEach(f=>{
          html += `<label class="flex items-center gap-2"><input type="checkbox" onchange="calcProgress()">${f.name} ×${f.count}份 单份：${f.num}</label>`
        })
        html += "</div>"
        box.innerHTML = html
        wrap.appendChild(box)
      })
      calcProgress()
    }
    function calcProgress(){
      const all = document.querySelectorAll(".buy-check").length
      const checked = document.querySelectorAll(".buy-check:checked").length
      const p = all ===0 ? 0 : Math.round((checked/all)*100)
      updateProgress(p)
    }
    function updateProgress(val){
      document.getElementById("progressNum").innerText = val + "%"
      document.getElementById("progressBar").style.width = val + "%"
    }
    function copyBuyList(){
      let txt = "采购清单：\n"
      document.querySelectorAll(".buy-check").forEach(cb=>{
        txt += (cb.checked?"✅":"⬜") + cb.parentElement.textContent + "\n"
      })
      const ta = document.getElementById("copyText")
      ta.value = txt
      ta.select()
      document.execCommand("copy")
      alert("清单已复制")
    }

    window.onload = ()=>{
      render(localData)
      updateCartBadge()
    }
  </script>
</body>
</html>
